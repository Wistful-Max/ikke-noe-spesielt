<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forside
    </title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img class="mode" id="light" src="images/sun.png" alt="the sun">
        <img class="mode" id="dark" src="images/moon.png" alt="the sun">
    </header>
    <main>
        <button class="points" id="plus">+1</button>
        <button class="points" id="minus">-1</button>
        <h1 id="counter">0</h1>
        <button class="points2" id="plus2">+1</button>
        <button class="points2" id="minus2">-1</button>
        <h1 id="counter2">0</h1>
    </main>
    <script src="script.js"></script>
</body>
</html>
